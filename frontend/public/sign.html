<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Подпись анкеты</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; background: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #000); padding: 16px; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    .signature-wrapper { border: 2px solid var(--tg-theme-hint-color, #ccc); border-radius: 12px; background: white; width: 100%; max-width: 400px; aspect-ratio: 2 / 1; touch-action: none; margin: 16px 0; }
    #signatureCanvas { width: 100%; height: 100%; display: block; border-radius: 10px; }
    .buttons { display: flex; gap: 12px; width: 100%; max-width: 400px; }
    button { flex: 1; padding: 14px; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; }
    .btn-clear { background: var(--tg-theme-hint-color, #ccc); color: var(--tg-theme-text-color, #000); }
    .btn-submit { background: var(--tg-theme-button-color, #2481cc); color: var(--tg-theme-button-text-color, #fff); }
  </style>
</head>
<body>
  <h2>🖊️ Поставьте подпись</h2>
  <div class="signature-wrapper">
    <canvas id="signatureCanvas"></canvas>
  </div>
  <div class="buttons">
    <button class="btn-clear" id="clearBtn">🗑️ Очистить</button>
    <button class="btn-submit" id="submitBtn">✅ Подписать</button>
  </div>
  <script>
    const canvas = document.getElementById('signatureCanvas');
    const pad = new SignaturePad(canvas, {
      backgroundColor: 'rgb(255, 255, 255)',
      penColor: 'rgb(0, 0, 0)',
      minWidth: 2,
      maxWidth: 4
    });

    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width * devicePixelRatio;
      canvas.height = rect.height * devicePixelRatio;
      canvas.style.width = rect.width + 'px';
      canvas.style.height = rect.height + 'px';
      pad.fromDataURL(canvas.toDataURL());
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    document.getElementById('clearBtn').addEventListener('click', () => {
      pad.clear();
    });

    document.getElementById('submitBtn').addEventListener('click', () => {
      if (pad.isEmpty()) {
        alert('Пожалуйста, поставьте подпись.');
        return;
      }
      const signatureData = pad.toDataURL('image/png');
      const userData = { signature: signatureData };
      Telegram.WebApp.sendData(JSON.stringify(userData));
      Telegram.WebApp.close();
    });
  </script>
</body>
</html>
