<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Подпись анкеты</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; background: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #000); padding: 16px; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    .signature-wrapper { border: 2px solid var(--tg-theme-hint-color, #ccc); border-radius: 12px; background: white; width: 100%; max-width: 400px; aspect-ratio: 2 / 1; touch-action: none; margin: 16px 0; }
    #signatureCanvas { width: 100%; height: 100%; display: block; border-radius: 10px; }
    .buttons { display: flex; gap: 12px; width: 100%; max-width: 400px; }
    button { flex: 1; padding: 14px; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; }
    .btn-clear { background: var(--tg-theme-hint-color, #ccc); color: var(--tg-theme-text-color, #000); }
    .btn-submit { background: var(--tg-theme-button-color, #2481cc); color: var(--tg-theme-button-text-color, #fff); }
    .status { margin-top: 12px; font-size: 14px; color: var(--tg-theme-hint-color, #666); text-align: center; }
  </style>
</head>
<body>
  <h2>🖊️ Поставьте подпись</h2>
  <div class="signature-wrapper">
    <canvas id="signatureCanvas"></canvas>
  </div>
  <div class="buttons">
    <button type="button" class="btn-clear" id="clearBtn">🗑️ Очистить</button>
    <button type="button" class="btn-submit" id="submitBtn">✅ Подписать</button>
  </div>
  <div class="status" id="status"></div>
  <script>
    const canvas = document.getElementById('signatureCanvas');
    const statusEl = document.getElementById('status');
    const webApp = window.Telegram?.WebApp;
    const params = new URLSearchParams(window.location.search);
    const targetUserId = params.get('user_id');

    if (!webApp) {
      statusEl.textContent = 'Откройте страницу подписи через кнопку в боте.';
    } else {
      webApp.ready();
      webApp.expand();
    }

    const pad = new SignaturePad(canvas, {
      backgroundColor: 'rgb(255, 255, 255)',
      penColor: 'rgb(0, 0, 0)',
      minWidth: 2,
      maxWidth: 4
    });

    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      const ratio = Math.max(window.devicePixelRatio || 1, 1);
      canvas.width = rect.width * ratio;
      canvas.height = rect.height * ratio;
      canvas.style.width = rect.width + 'px';
      canvas.style.height = rect.height + 'px';
      const ctx = canvas.getContext('2d');
      ctx.scale(ratio, ratio);
      pad.clear();
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    document.getElementById('clearBtn').addEventListener('click', () => {
      pad.clear();
    });

    const submitSignature = () => {
      if (!targetUserId) {
        alert('Не указан ID заявки.');
        return;
      }

      if (pad.isEmpty()) {
        alert('Пожалуйста, поставьте подпись.');
        return;
      }

      if (!webApp || typeof webApp.sendData !== 'function') {
        alert('Откройте страницу подписи через кнопку «Подписать анкету» в боте.');
        return;
      }

      const payload = {
        user_id: Number(targetUserId),
        signature: pad.toDataURL('image/png')
      };

      statusEl.textContent = 'Отправка подписи...';
      webApp.sendData(JSON.stringify(payload));
      webApp.close();
    };

    document.getElementById('submitBtn').addEventListener('click', submitSignature);

    if (webApp) {
      webApp.MainButton.setText('✅ Подписать');
      webApp.MainButton.show();
      webApp.MainButton.onClick(submitSignature);
    }
  </script>
</body>
</html>
