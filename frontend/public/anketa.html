<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Анкета</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; background: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #000); padding: 16px; margin: 0; }
    .input-group { margin-bottom: 16px; }
    label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 4px; }
    input, textarea { width: 100%; padding: 10px; border: 1px solid var(--tg-theme-hint-color, #ccc); border-radius: 8px; background: var(--tg-theme-secondary-bg-color, #f5f5f5); color: var(--tg-theme-text-color, #000); font-size: 16px; box-sizing: border-box; }
    button { width: 100%; padding: 14px; background: var(--tg-theme-button-color, #2481cc); color: var(--tg-theme-button-text-color, #fff); border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <h1>📝 Заявка на вступление</h1>
  <form id="anketaForm">
    <div class="input-group">
      <label>ФИО</label>
      <input type="text" name="fio" required placeholder="Иванов Иван Иванович">
    </div>
    <div class="input-group">
      <label>Возраст</label>
      <input type="number" name="age" required placeholder="25">
    </div>
    <div class="input-group">
      <label>Опыт работы (лет)</label>
      <input type="number" name="experience" required placeholder="3">
    </div>
    <div class="input-group">
      <label>Почему хотите вступить?</label>
      <textarea name="reason" rows="3" placeholder="Расскажите о себе..." required></textarea>
    </div>
    <button type="submit">📤 Отправить</button>
  </form>
  <script>
    const form = document.getElementById('anketaForm');
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const formData = new FormData(form);
      const data = {};
      formData.forEach((value, key) => { data[key] = value; });
      Telegram.WebApp.sendData(JSON.stringify(data));
      Telegram.WebApp.close();
    });
  </script>
</body>
</html>
