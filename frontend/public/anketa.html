<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Анкета</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; background: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #000); padding: 16px; margin: 0; }
    .input-group { margin-bottom: 16px; }
    label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 4px; }
    input, textarea { width: 100%; padding: 10px; border: 1px solid var(--tg-theme-hint-color, #ccc); border-radius: 8px; background: var(--tg-theme-secondary-bg-color, #f5f5f5); color: var(--tg-theme-text-color, #000); font-size: 16px; box-sizing: border-box; }
    button { width: 100%; padding: 14px; background: var(--tg-theme-button-color, #2481cc); color: var(--tg-theme-button-text-color, #fff); border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; }
    .status { margin-top: 12px; font-size: 14px; color: var(--tg-theme-hint-color, #666); text-align: center; }
  </style>
</head>
<body>
  <h1>📝 Заявка на вступление</h1>
  <form id="anketaForm">
    <div class="input-group">
      <label>ФИО</label>
      <input type="text" name="fio" required placeholder="Иванов Иван Иванович">
    </div>
    <div class="input-group">
      <label>Возраст</label>
      <input type="number" name="age" required placeholder="25" min="1">
    </div>
    <div class="input-group">
      <label>Опыт работы (лет)</label>
      <input type="number" name="experience" required placeholder="3" min="0">
    </div>
    <div class="input-group">
      <label>Почему хотите вступить?</label>
      <textarea name="reason" rows="3" placeholder="Расскажите о себе..." required></textarea>
    </div>
  </form>
  <div class="status" id="status"></div>
  <script>
    const form = document.getElementById('anketaForm');
    const statusEl = document.getElementById('status');
    const webApp = window.Telegram?.WebApp;

    if (!webApp) {
      statusEl.textContent = 'Откройте анкету через кнопку в боте Telegram.';
      console.error('Telegram WebApp not available');
    } else {
      console.log('Telegram WebApp initialized');
      console.log('WebApp version:', webApp.version);
      console.log('WebApp platform:', webApp.platform);
      console.log('initDataUnsafe:', webApp.initDataUnsafe);
      console.log('User data:', webApp.initDataUnsafe?.user);
      console.log('sendData type:', typeof webApp.sendData);
      
      // Проверка правильной инициализации
      if (!webApp.initDataUnsafe?.user && webApp.platform !== 'web') {
        console.warn('WebApp opened without user data - not a proper Telegram WebApp');
        statusEl.textContent = '⚠️ Откройте анкету через кнопку в боте, а не напрямую';
      }
      
      webApp.ready();
      webApp.expand();

      const submitAnketa = async () => {
        console.log('Submit button clicked');
        
        if (!form.checkValidity()) {
          form.reportValidity();
          return;
        }

        const formData = new FormData(form);
        const data = {};
        formData.forEach((value, key) => { data[key] = String(value).trim(); });

        // Получаем параметры из URL
        const urlParams = new URLSearchParams(window.location.search);
        const urlUserId = urlParams.get('user_id');
        const botToken = urlParams.get('bot_token');
        const username = urlParams.get('username') || 'unknown';
        const adminIds = urlParams.get('admin_ids');
        const userId = webApp.initDataUnsafe?.user?.id || (urlUserId ? parseInt(urlUserId) : null);
        
        console.log('User ID from WebApp:', webApp.initDataUnsafe?.user?.id);
        console.log('User ID from URL:', urlUserId);
        console.log('Bot token from URL:', botToken ? 'present' : 'missing');
        console.log('Username:', username);
        console.log('Admin IDs:', adminIds);
        console.log('Final User ID:', userId);

        if (!userId) {
          console.error('No user_id available!');
          statusEl.textContent = 'Ошибка: не удалось определить ID пользователя';
          alert('Ошибка: откройте анкету через бота');
          return;
        }
        
        statusEl.textContent = 'Отправка...';
        
        // Используем Vercel API для отправки
        if (botToken && adminIds) {
          console.log('Using Vercel API method...');
          try {
            const response = await fetch('/api/send-anketa', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({
                bot_token: botToken,
                user_id: userId,
                username: username,
                admin_ids: adminIds,
                data: data
              })
            });

            const result = await response.json();
            console.log('API response:', result);

            if (result.success) {
              statusEl.textContent = '✅ Заявка отправлена на модерацию!';
              setTimeout(() => {
                if (webApp.close) webApp.close();
              }, 1000);
            } else {
              throw new Error(result.error || 'Unknown error');
            }
          } catch (e) {
            console.error('API error:', e);
            statusEl.textContent = '❌ Ошибка отправки: ' + e.message;
            // Fallback на clipboard
            const messageText = `📋 Новая заявка от @${username}\n\nФИО: ${data.fio}\nВозраст: ${data.age}\nОпыт: ${data.experience}\nПричина: ${data.reason}\n\nUser ID: ${userId}`;
            navigator.clipboard.writeText(messageText).then(() => {
              alert('Ошибка API. Данные скопированы. Отправьте боту вручную.');
            });
          }
        } else {
          console.log('No bot token, using fallback');
          // Fallback: копируем в буфер обмена
          const messageText = `📋 Новая заявка\n\nФИО: ${data.fio}\nВозраст: ${data.age}\nОпыт: ${data.experience}\nПричина: ${data.reason}\n\nUser ID: ${userId}`;
          
          navigator.clipboard.writeText(messageText).then(() => {
            statusEl.textContent = '✅ Данные скопированы! Отправьте их боту.';
            alert('Данные скопированы в буфер обмена. Откройте чат с ботом и вставьте текст (Ctrl+V).');
            if (webApp.close) webApp.close();
          }).catch(err => {
            console.error('Clipboard error:', err);
            statusEl.textContent = '❌ Не удалось скопировать. Скопируйте текст вручную:';
            alert('Скопируйте этот текст и отправьте боту:\n\n' + messageText);
          });
        }
      };

      webApp.MainButton.setText('📤 Отправить заявку');
      webApp.MainButton.show();
      webApp.MainButton.onClick(submitAnketa);
      console.log('MainButton configured');
    }
  </script>
</body>
</html>
